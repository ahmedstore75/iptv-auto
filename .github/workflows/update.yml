name: Auto Update IPTV List

on:
  schedule:
    
    - cron: '17,47 * * * *'
  workflow_dispatch:        

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4   

    - name: Set up Python
      uses: actions/setup-python@v5  
      with:
        python-version: '3.x'

    - name: Run script
      env:
        MY_CUSTOM_SOURCES: ${{ secrets.MY_CUSTOM_SOURCES }}
      run: python main.py

    - name: Commit and push updated playlist and json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u channels.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist and json" && git push)
